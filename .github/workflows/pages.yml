name: Publish PICK3 AI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pick3-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test dashboard
        run: |
          node --check web/app.js
          node --test tests/dashboard.test.js
          python -m json.tool web/data/predictions.json > /dev/null
      - name: Package V2 dashboard
        run: python scripts/package_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -ge 1 ]; then exit 0; fi
            sleep 5
          done
          echo '::error::Pages artifact was not indexed after one minute'
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live commit and dataset
        run: python scripts/verify_site.py
