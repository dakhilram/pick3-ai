name: Update official draws and evaluate models
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    # UTC triggers cover BOTH CDT and CST; timezone gate below executes
    # precisely two post-draw checks for each of four Houston sessions.
    - cron: '35 0,15,16,23 * * *'
    - cron: '15 0,1,16,17 * * *'
    - cron: '5 18,19 * * *'
    - cron: '45 3,4,18,19 * * *'
    - cron: '25 4,5 * * *'
permissions:
  contents: write
concurrency:
  group: pick3-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Check Houston post-draw window
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/schedule_gate.py
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Run unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -v
      - name: Check official draws or train daily models
        if: steps.gate.outputs.run == 'true'
        env:
          PICK3_TRAIN_MODE: ${{ steps.gate.outputs.train == 'true' && 'train' || 'refresh' }}
        run: python scripts/train.py
      - name: Validate generated dataset
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('web/data/predictions.json')
          assert p.is_file(), 'Training produced no web/data/predictions.json'
          data=json.loads(p.read_text())
          assert set(data['games'])=={'morning','day','evening','night'}
          history=json.loads(Path('web/data/live_history.json').read_text())
          assert set(history.get('games', {})).issubset(data['games'])
          for label,game in data['games'].items():
              assert game['draws']>=160, label
              assert len(game['probabilities'])==3, label
              assert len(game.get('v2_top10', []))==10, label
              assert len(set(game['v2_top10']))==10, label
              assert all(len(d)==10 and abs(sum(d)-1)<0.0001 for d in game['probabilities']), label
          print('Validated',p,'with four draw sessions')
          PY
      - name: Commit new model output
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f web/data/predictions.json web/data/live_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official Texas Pick 3 model outputs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
