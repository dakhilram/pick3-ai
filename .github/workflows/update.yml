name: Update official draws and evaluate models
on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 0,2-6'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/train.py
      - name: Commit verified fresh results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/predictions.json
          git diff --staged --quiet || (git commit -m 'Update official Texas Pick 3 model outputs' && git push)
