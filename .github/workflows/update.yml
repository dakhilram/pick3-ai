name: Verify official draws and publish Pick3 AI V2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/v2.py'
      - 'scripts/schedule_gate.py'
      - 'tests/test_v2.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    # First checks: 10:06, 12:33, 18:06, 22:18 Central, in both CDT and CST.
    # Later checks catch official publication and delayed Actions runners.
    - cron: '6,26,56 15,16 * * *'
    - cron: '33,53 17,18 * * *'
    - cron: '13 18,19 * * *'
    - cron: '6,26,56 23,0 * * *'
    - cron: '18,38,58 3,4 * * *'
    - cron: '18 5 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install IANA time-zone data
        run: python -m pip install 'tzdata>=2025.2'
      - name: Test lightweight model and schedule
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_v2.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for case, detail in result.failures + result.errors:
              message = (f'{case.id()}: {detail}'
                         .replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              print(f'::error title=Pick3 V2 test failure::{message}')
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Check official archives and publish snapshots
        run: python scripts/v2.py
      - name: Validate JSON and browser script
        run: |
          python -m json.tool web/data/predictions.json > /dev/null
          node --check web/app.js
          node --test tests/dashboard.test.js
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('web/data/predictions.json').read_text())
          assert data['schema_version']==9
          assert set(data['sessions'])=={'morning','day','evening','night'}
          for item in data['sessions'].values():
              picks=item['predictions']
              assert len(picks)==10 and len({p['group'] for p in picks})==10
              assert all(len(p['group'])==3 and ''.join(sorted(p['group']))==p['group'] for p in picks)
          PY
      - name: Commit verified data
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/predictions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Pick3 AI V2 forecasts'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # Commits made with GITHUB_TOKEN do not trigger pages.yml.
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - name: Package V2 dashboard
        if: steps.commit.outputs.changed == 'true'
        run: python scripts/package_site.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true'
